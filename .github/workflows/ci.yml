name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      - name: Run backend tests
        run: uv run pytest
        working-directory: backend

      - name: Verify frozen Python API contract
        run: uv run python ../scripts/export-python-openapi.py --check
        working-directory: backend

  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      # scripts/ and api/ are included deliberately: ruff was only ever
      # pointed at backend/, so those two drifted without anyone seeing it.
      - name: Lint
        run: uv run ruff check app tests ../scripts ../api
        working-directory: backend

      # Without this the formatter stays optional, and whoever runs it next
      # reformats the tree inside an unrelated change. `make format` fixes.
      - name: Check formatting
        run: uv run ruff format --check app tests ../scripts ../api
        working-directory: backend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  automation-tests:
    name: Automation tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No npm ci: the automation tests and syntax checks use only node
      # built-ins, and the network guard must hold with zero dependencies.
      - name: Run automation syntax checks
        run: npm run check
        working-directory: automation

      - name: Run automation tests (incl. network guard)
        run: npm test
        working-directory: automation
